name: Bug report
description: Something in algotrail does not work as described.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The page (for example `#/visualize/dijkstra`) and what you did. For a visualizer, paste its *Copy link* address (it holds your input and the step) or the input you used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors (optional)
      description: Anything red in the browser's developer console.
      render: text
